<html>
<html lang="en"> 
<head>
  <body>
    <script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Save Food - Food Donation App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --green-900: #0f3d2b;
      --green-700: #176744;
      --green-600: #21865b;
      --green-500: #2fa673;
      --green-100: #e5f5e9;
      --green-50: #f3faf5;
      --cream: #fbf8f1;
      --ink: #1f3328;
      --muted: #62756a;
      --line: #e1ebe3;
      --amber: #e9a23b;
      --amber-bg: #fff4de;
      --blue: #3b82c4;
      --blue-bg: #e6f1fb;
      --purple: #7a5cc4;
      --purple-bg: #efe9fb;
      --radius: 18px;
      --shadow: 0 10px 30px -12px rgba(15, 61, 43, .18);
      --shadow-lg: 0 20px 45px -15px rgba(15, 61, 43, .28);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, Arial, sans-serif;
      background:
        radial-gradient(900px 400px at 100% -5%, #dff3e6 0%, transparent 60%),
        radial-gradient(700px 400px at -10% 30%, #fdf1d9 0%, transparent 55%),
        var(--cream);
      background-attachment: fixed;
      color: var(--ink);
      line-height: 1.55;
      min-height: 100vh;
    }

    /* ---------- Hero ---------- */
    header {
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, var(--green-900) 0%, var(--green-600) 60%, var(--green-500) 100%);
      color: #fff;
      padding: 54px 20px 90px;
      text-align: center;
    }
    header::before, header::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,.07);
    }
    header::before { width: 340px; height: 340px; top: -140px; left: -80px; }
    header::after  { width: 260px; height: 260px; bottom: -120px; right: -40px; }
    .hero-inner { position: relative; z-index: 1; animation: rise .7s ease both; }
    .logo {
      display: inline-flex; align-items: center; justify-content: center;
      width: 68px; height: 68px; border-radius: 22px;
      background: rgba(255,255,255,.16);
      border: 1px solid rgba(255,255,255,.3);
      backdrop-filter: blur(6px);
      font-size: 34px; margin-bottom: 14px;
      box-shadow: 0 10px 25px -10px rgba(0,0,0,.4);
    }
    header h1 {
      font-family: 'Fraunces', Georgia, serif;
      font-size: clamp(34px, 6vw, 52px);
      margin: 0 0 8px; letter-spacing: -.5px;
    }
    header p { margin: 0; font-size: clamp(15px, 2.4vw, 18px); opacity: .9; }

    /* ---------- Navigation ---------- */
    nav {
      position: sticky; top: 12px; z-index: 20;
      display: flex; gap: 6px; flex-wrap: wrap; justify-content: center;
      width: fit-content; max-width: calc(100% - 24px);
      margin: -32px auto 0;
      padding: 8px;
      background: rgba(255,255,255,.88);
      backdrop-filter: blur(14px);
      border: 1px solid var(--line);
      border-radius: 999px;
      box-shadow: var(--shadow-lg);
    }
    nav button {
      position: relative;
      display: inline-flex; align-items: center; gap: 7px;
      background: transparent; color: var(--muted);
      padding: 10px 16px; font-size: 14px; font-weight: 600;
      border-radius: 999px;
    }
    nav button:hover { background: var(--green-50); color: var(--green-700); transform: none; box-shadow: none; }
    nav button.active { background: var(--green-600); color: #fff; box-shadow: 0 6px 14px -6px rgba(33,134,91,.7); }
    .badge {
      min-width: 20px; height: 20px; padding: 0 6px;
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: 999px; font-size: 11px; font-weight: 700;
      background: var(--amber); color: #fff;
    }
    .badge.hidden { display: none; }

    /* ---------- Layout ---------- */
    main { max-width: 960px; margin: 34px auto 0; padding: 0 16px; }
    .page { animation: rise .45s ease both; }
    .hidden { display: none !important; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

    .panel {
      background: #fff;
      padding: 28px;
      margin-bottom: 22px;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
    }
    .panel h2 {
      font-family: 'Fraunces', Georgia, serif;
      font-size: 26px; margin: 0 0 6px; letter-spacing: -.3px;
    }
    .sub { color: var(--muted); margin: 0 0 22px; }

    /* ---------- Stats ---------- */
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .stat {
      position: relative; overflow: hidden;
      padding: 20px; border-radius: 16px;
      background: linear-gradient(160deg, var(--green-50), var(--green-100));
      border: 1px solid #d3ead9;
      color: var(--muted); font-size: 13px; font-weight: 600;
      text-transform: uppercase; letter-spacing: .6px;
      transition: transform .25s, box-shadow .25s;
    }
    .stat:hover { transform: translateY(-4px); box-shadow: var(--shadow); }
    .stat .ico { font-size: 22px; display: block; margin-bottom: 6px; }
    .stat strong {
      display: block; font-family: 'Fraunces', Georgia, serif;
      font-size: 40px; line-height: 1.1; color: var(--green-600);
      margin-top: 4px; letter-spacing: -1px;
    }

    /* ---------- Role switch ---------- */
    .roles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .role-card {
      cursor: pointer; text-align: center;
      padding: 18px 12px; border-radius: 16px;
      border: 2px solid var(--line); background: #fff;
      transition: all .2s;
    }
    .role-card:hover { border-color: var(--green-500); transform: translateY(-2px); }
    .role-card.selected { border-color: var(--green-600); background: var(--green-50); box-shadow: 0 8px 20px -10px rgba(33,134,91,.6); }
    .role-card .emoji { font-size: 30px; display: block; }
    .role-card b { display: block; margin-top: 4px; }
    .role-card small { color: var(--muted); }
    #role { display: none; }

    .notice {
      margin: 16px 0 0; padding: 10px 14px;
      background: var(--amber-bg); color: #8a5a10;
      border-radius: 10px; font-size: 13px;
    }

    /* ---------- Buttons ---------- */
    button {
      border: none; border-radius: 12px;
      padding: 12px 20px;
      background: var(--green-600); color: #fff;
      cursor: pointer; font: 600 14px 'Inter', sans-serif;
      transition: transform .15s, box-shadow .2s, background .2s;
    }
    button:hover { background: var(--green-700); transform: translateY(-2px); box-shadow: 0 8px 18px -8px rgba(33,134,91,.8); }
    button:active { transform: translateY(0); }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .role-card:focus-visible {
      outline: 3px solid rgba(47,166,115,.4); outline-offset: 2px;
    }
    button.ghost { background: var(--green-50); color: var(--green-700); border: 1px solid #cfe6d6; }
    button.ghost:hover { background: var(--green-100); box-shadow: none; }
    .submit-btn { width: 100%; padding: 15px; font-size: 16px; margin-top: 22px; }

    /* ---------- Form ---------- */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 18px; }
    .full { grid-column: 1 / -1; }
    label { display: block; margin: 16px 0 7px; font-weight: 600; font-size: 14px; }
    input, select, textarea {
      width: 100%; padding: 13px 14px;
      border: 1.5px solid #d6e3d9; border-radius: 12px;
      font: inherit; background: #fcfefc; color: var(--ink);
      transition: border-color .2s, box-shadow .2s;
    }
    input:focus, textarea:focus { border-color: var(--green-500); box-shadow: 0 0 0 4px rgba(47,166,115,.15); outline: none; }
    textarea { min-height: 96px; resize: vertical; }

    /* ---------- Donation cards ---------- */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .donation {
      position: relative;
      border: 1px solid var(--line);
      padding: 20px; border-radius: 16px;
      background: #fff;
      transition: transform .25s, box-shadow .25s, border-color .25s;
      animation: rise .4s ease both;
    }
    .donation::before {
      content: ""; position: absolute; left: 0; top: 18px; bottom: 18px; width: 4px;
      border-radius: 0 4px 4px 0; background: var(--green-500);
    }
    .donation:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); border-color: #cfe6d6; }
    .donation h3 { margin: 0 0 10px; font-size: 18px; display: flex; gap: 8px; align-items: center; }
    .meta { display: flex; gap: 10px; align-items: flex-start; margin: 7px 0; font-size: 14px; color: #3d5246; }
    .meta .i { width: 22px; text-align: center; flex-shrink: 0; }
    .meta span.k { color: var(--muted); }
    .note-box { margin-top: 10px; padding: 9px 12px; background: var(--amber-bg); border-radius: 10px; font-size: 13px; color: #8a5a10; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
    .actions button { flex: 1; padding: 11px 12px; }

    .status {
      display: inline-flex; align-items: center; gap: 6px;
      border-radius: 999px; padding: 5px 12px;
      font-size: 12px; font-weight: 700; letter-spacing: .3px;
      background: var(--green-100); color: var(--green-700);
    }
    .status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    .status.accepted { background: var(--blue-bg); color: #1f5f99; }
    .status.picked { background: var(--purple-bg); color: #5a3fa3; }
    .status.delivered { background: #d9f3e2; color: #11663f; }

    /* ---------- Tracking stepper ---------- */
    .track-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
    .stepper { display: flex; margin: 20px 0 6px; }
    .step { flex: 1; text-align: center; position: relative; font-size: 11px; color: var(--muted); font-weight: 600; }
    .step::before {
      content: ""; position: absolute; top: 13px; left: -50%; width: 100%; height: 3px;
      background: var(--line); z-index: 0;
    }
    .step:first-child::before { display: none; }
    .step .dot {
      position: relative; z-index: 1;
      width: 28px; height: 28px; margin: 0 auto 6px;
      border-radius: 50%; background: #fff; border: 3px solid var(--line);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; color: #fff; transition: all .3s;
    }
    .step.done { color: var(--green-700); }
    .step.done::before { background: var(--green-500); }
    .step.done .dot { background: var(--green-500); border-color: var(--green-500); }

    /* ---------- Notifications ---------- */
    .note-item {
      display: flex; gap: 14px; align-items: flex-start;
      padding: 14px 16px; border-radius: 14px;
      border: 1px solid var(--line); margin-bottom: 10px; background: #fff;
      animation: rise .35s ease both;
    }
    .note-item .bell {
      width: 38px; height: 38px; flex-shrink: 0; border-radius: 12px;
      background: var(--green-100); display: flex; align-items: center; justify-content: center;
    }
    .note-item p { margin: 0 0 2px; font-weight: 500; }
    .note-item small { color: var(--muted); }
    .panel-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
    .panel-head h2 { margin: 0; }

    /* ---------- Empty state ---------- */
    .empty { text-align: center; padding: 38px 10px; color: var(--muted); }
    .empty .big { font-size: 52px; display: block; margin-bottom: 8px; }
    .empty b { display: block; color: var(--ink); font-size: 17px; margin-bottom: 4px; }
    .empty button { margin-top: 16px; }

    /* ---------- Toast ---------- */
    #toasts { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); z-index: 100; display: flex; flex-direction: column; gap: 10px; align-items: center; width: calc(100% - 28px); pointer-events: none; }
    .toast {
      pointer-events: auto;
      background: var(--green-900); color: #fff;
      padding: 13px 20px; border-radius: 14px; font-size: 14px; font-weight: 500;
      box-shadow: var(--shadow-lg); max-width: 440px;
      animation: toastIn .35s ease both;
    }
    .toast.error { background: #a63c2f; }
    .toast.out { animation: toastOut .3s ease forwards; }
    @keyframes toastIn { from { opacity: 0; transform: translateY(16px) scale(.96); } to { opacity: 1; transform: none; } }
    @keyframes toastOut { to { opacity: 0; transform: translateY(10px); } }

    footer { text-align: center; padding: 40px 20px 50px; color: var(--muted); font-size: 14px; }

    @media (max-width: 640px) {
      header { padding: 40px 16px 80px; }
      nav { border-radius: 22px; gap: 4px; }
      nav button { padding: 9px 12px; font-size: 13px; flex: 1 1 auto; justify-content: center; }
      .stats, .roles { grid-template-columns: 1fr; }
      .form-grid { grid-template-columns: 1fr; }
      .panel { padding: 20px; }
      .stat strong { font-size: 34px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <header>
    <div class="hero-inner">
      <div class="logo">🥬</div>
      <h1>Save Food</h1>
      <p>Rescue food. Share hope. Reduce food waste.</p>
    </div>
  </header>

  <nav id="nav">
    <button data-page="dashboard" onclick="showPage('dashboard')">🏠 Dashboard</button>
    <button data-page="donate" onclick="showPage('donate')">🍱 Donate Food</button>
    <button data-page="available" onclick="showPage('available')">🛒 Available <span class="badge hidden" id="availBadge">0</span></button>
    <button data-page="tracking" onclick="showPage('tracking')">📍 Track</button>
    <button data-page="notifications" onclick="showPage('notifications')">🔔 Alerts <span class="badge hidden" id="notifBadge">0</span></button>
  </nav>

  <main>
    <section id="dashboard" class="page">
      <div class="panel">
        <h2>Welcome to Save Food!</h2>
        <p class="sub">Connect food donors, volunteers, and organizations to help people in need.</p>
        <div class="stats">
          <div class="stat"><span class="ico">🍲</span>Available Donations<strong id="availableCount">0</strong></div>
          <div class="stat"><span class="ico">🍽️</span>Meals Rescued<strong id="mealCount">0</strong></div>
          <div class="stat"><span class="ico">🚚</span>Delivered<strong id="deliveredCount">0</strong></div>
        </div>
      </div>
      <div class="panel">
        <h2>Choose Your Role</h2>
        <p class="sub">Tell us how you'd like to help today.</p>
        <select id="role" aria-label="Role">
          <option>Donor</option>
          <option>Volunteer</option>
          <option>Organization</option>
        </select>
        <div class="roles" id="roleCards">
          <div class="role-card" tabindex="0" data-role="Donor"><span class="emoji">🧑‍🍳</span><b>Donor</b><small>Share surplus food</small></div>
          <div class="role-card" tabindex="0" data-role="Volunteer"><span class="emoji">🚴</span><b>Volunteer</b><small>Pick up &amp; deliver</small></div>
          <div class="role-card" tabindex="0" data-role="Organization"><span class="emoji">🏠</span><b>Organization</b><small>Receive &amp; distribute</small></div>
        </div>
        <p class="notice">ℹ️ This is a prototype role selector, not a real login system.</p>
      </div>
    </section>

    <section id="donate" class="page hidden">
      <div class="panel">
        <h2>Food Donation Form</h2>
        <p class="sub">Fill in the details and we'll let volunteers know right away.</p>
        <form id="donationForm">
          <div class="form-grid">
            <div>
              <label for="foodName">Food Name *</label>
              <input id="foodName" required placeholder="e.g. Vegetable rice">
            </div>
            <div>
              <label for="quantity">Quantity / Servings *</label>
              <input id="quantity" required placeholder="e.g. 20 servings">
            </div>
            <div class="full">
              <label for="location">Pickup Location *</label>
              <input id="location" required placeholder="Enter pickup address">
            </div>
            <div>
              <label for="expiry">Consume By *</label>
              <input id="expiry" required type="datetime-local">
            </div>
            <div>
              <label for="donor">Donor Name *</label>
              <input id="donor" required placeholder="Enter donor name">
            </div>
            <div class="full">
              <label for="notes">Storage / Allergen Information</label>
              <textarea id="notes" placeholder="Storage instructions or allergens"></textarea>
            </div>
          </div>
          <button type="submit" class="submit-btn">💚 Publish Donation</button>
        </form>
      </div>
    </section>

    <section id="available" class="page hidden">
      <div class="panel">
        <h2>Available Food Donations</h2>
        <p class="sub">Fresh food waiting to be rescued near you.</p>
        <div id="donationList" class="grid"></div>
      </div>
    </section>

    <section id="tracking" class="page hidden">
      <div class="panel">
        <h2>Donation Tracking</h2>
        <p class="sub">Follow every donation from kitchen to table.</p>
        <div id="trackingList"></div>
      </div>
    </section>

    <section id="notifications" class="page hidden">
      <div class="panel">
        <div class="panel-head">
          <h2>Notifications</h2>
          <button class="ghost" id="markRead">Mark all as read</button>
        </div>
        <div id="notificationList"></div>
      </div>
    </section>
  </main>

  <footer>Save Food © 2026 &nbsp;|&nbsp; Share food, spread kindness. 💚</footer>
  <div id="toasts" aria-live="polite"></div>

  <script>
    const KEY = "saveFoodDonations";
    const NOTIFY_KEY = "saveFoodNotifications";
    const READ_KEY = "saveFoodNotifRead";

    let donations = JSON.parse(localStorage.getItem(KEY) || "[]");
    let notifications = JSON.parse(localStorage.getItem(NOTIFY_KEY) || "[]");
    let readCount = Number(localStorage.getItem(READ_KEY) || 0);
    let currentPage = "dashboard";

    function saveData() {
      localStorage.setItem(KEY, JSON.stringify(donations));
      localStorage.setItem(NOTIFY_KEY, JSON.stringify(notifications));
      localStorage.setItem(READ_KEY, String(readCount));
      render();
    }

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[char]);
    }

    function toast(message, type) {
      const el = document.createElement("div");
      el.className = "toast" + (type === "error" ? " error" : "");
      el.textContent = message;
      document.getElementById("toasts").appendChild(el);
      setTimeout(() => {
        el.classList.add("out");
        setTimeout(() => el.remove(), 300);
      }, 2800);
    }

    function showPage(id) {
      currentPage = id;
      document.querySelectorAll(".page").forEach(p => p.classList.add("hidden"));
      document.getElementById(id).classList.remove("hidden");
      document.querySelectorAll("nav button").forEach(b =>
        b.classList.toggle("active", b.dataset.page === id));
      window.scrollTo({ top: 0, behavior: "smooth" });
      render();
    }

    function notify(message) {
      notifications.unshift({ message, time: new Date().toLocaleString() });
    }

    function formatExpiry(value) {
      const d = new Date(value);
      if (isNaN(d)) return value;
      return d.toLocaleString([], { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
    }

    function statusClass(s) {
      return s === "Accepted" ? "accepted" : s === "Picked Up" ? "picked" : s === "Delivered" ? "delivered" : "";
    }

    function stepper(status) {
      const steps = ["Available", "Accepted", "Picked Up", "Delivered"];
      const idx = steps.indexOf(status);
      return `<div class="stepper">${steps.map((s, i) => `
        <div class="step ${i <= idx ? "done" : ""}">
          <div class="dot">${i <= idx ? "✓" : ""}</div>${s}
        </div>`).join("")}</div>`;
    }

    function render() {
      const available = donations.filter(d => d.status === "Available");
      const delivered = donations.filter(d => d.status === "Delivered");
      const unread = Math.max(notifications.length - readCount, 0);

      document.getElementById("availableCount").textContent = available.length;
      document.getElementById("deliveredCount").textContent = delivered.length;
      document.getElementById("mealCount").textContent =
        delivered.reduce((sum, d) => sum + (Number(d.meals) || 0), 0);

      const ab = document.getElementById("availBadge");
      ab.textContent = available.length;
      ab.classList.toggle("hidden", !available.length);
      const nb = document.getElementById("notifBadge");
      nb.textContent = unread;
      nb.classList.toggle("hidden", !unread);

      document.getElementById("donationList").innerHTML =
        available.length ? available.map(d => `
          <div class="donation">
            <h3>🍲 ${escapeHTML(d.name)}</h3>
            <div class="meta"><span class="i">🍽️</span><div><span class="k">Quantity:</span> ${escapeHTML(d.quantity)}</div></div>
            <div class="meta"><span class="i">📍</span><div><span class="k">Pickup:</span> ${escapeHTML(d.location)}</div></div>
            <div class="meta"><span class="i">⏰</span><div><span class="k">Consume by:</span> ${escapeHTML(formatExpiry(d.expiry))}</div></div>
            <div class="meta"><span class="i">👤</span><div><span class="k">Donor:</span> ${escapeHTML(d.donor)}</div></div>
            ${d.notes ? `<div class="note-box">⚠️ ${escapeHTML(d.notes)}</div>` : ""}
            <p style="margin:14px 0 0"><span class="status">${escapeHTML(d.status)}</span></p>
            <div class="actions">
              <button class="ghost" onclick="openMap('${d.id}')">🗺️ Open Map</button>
              <button onclick="acceptDonation('${d.id}')">Accept Pickup</button>
            </div>
          </div>
        `).join("") : `
          <div class="empty" style="grid-column:1/-1">
            <span class="big">🌱</span><b>No available donations yet</b>
            Be the first to share some food today.
            <br><button onclick="showPage('donate')">Donate Food</button>
          </div>`;

      document.getElementById("trackingList").innerHTML =
        donations.length ? donations.slice().reverse().map(d => `
          <div class="donation" style="margin-bottom:14px">
            <div class="track-head">
              <div>
                <h3 style="margin-bottom:4px">${escapeHTML(d.name)}</h3>
                <div class="meta" style="margin:2px 0"><span class="i">👤</span><div><span class="k">Donor:</span> ${escapeHTML(d.donor)}</div></div>
                <div class="meta" style="margin:2px 0"><span class="i">🚴</span><div><span class="k">Volunteer:</span> ${escapeHTML(d.volunteer || "Not assigned")}</div></div>
              </div>
              <span class="status ${statusClass(d.status)}">${escapeHTML(d.status)}</span>
            </div>
            ${stepper(d.status)}
            ${d.status === "Accepted" || d.status === "Picked Up" ? `
              <div class="actions">
                ${d.status === "Accepted" ? `<button onclick="updateStatus('${d.id}', 'Picked Up')">📦 Mark Picked Up</button>` : ""}
                ${d.status === "Picked Up" ? `<button onclick="updateStatus('${d.id}', 'Delivered')">✅ Mark Delivered</button>` : ""}
              </div>` : ""}
          </div>
        `).join("") : `
          <div class="empty">
            <span class="big">📦</span><b>No donations to track yet</b>
            Published donations will show up here with live progress.
          </div>`;

      document.getElementById("notificationList").innerHTML =
        notifications.length ? notifications.map((n, i) => `
          <div class="note-item" ${i < notifications.length - readCount && currentPage !== "notifications" ? "" : ""}>
            <div class="bell">🔔</div>
            <div><p>${escapeHTML(n.message)}</p><small>${escapeHTML(n.time)}</small></div>
          </div>
        `).join("") : `
          <div class="empty">
            <span class="big">🔕</span><b>No notifications yet</b>
            Updates about your donations will appear here.
          </div>`;

      document.querySelectorAll(".role-card").forEach(c =>
        c.classList.toggle("selected", c.dataset.role === document.getElementById("role").value));
    }

    document.getElementById("donationForm").addEventListener("submit", event => {
      event.preventDefault();

      const expiry = document.getElementById("expiry").value;
      if (new Date(expiry).getTime() < Date.now()) {
        toast("Please enter a future consume-by date and time.", "error");
        return;
      }

      const quantity = document.getElementById("quantity").value.trim();
      const number = parseInt(quantity, 10);

      const donation = {
        id: Date.now().toString(),
        name: document.getElementById("foodName").value.trim(),
        quantity,
        meals: Number.isFinite(number) ? Math.max(number, 0) : 0,
        location: document.getElementById("location").value.trim(),
        expiry,
        donor: document.getElementById("donor").value.trim(),
        notes: document.getElementById("notes").value.trim(),
        status: "Available",
        volunteer: ""
      };

      donations.push(donation);
      notify("New donation available: " + donation.name);
      saveData();
      event.target.reset();
      showPage("available");
      toast("🎉 Food donation published successfully!");
    });

    function acceptDonation(id) {
      const role = document.getElementById("role").value;
      if (!["Volunteer", "Organization"].includes(role)) {
        toast("Please select the Volunteer or Organization role first.", "error");
        showPage("dashboard");
        return;
      }

      const donation = donations.find(d => d.id === id);
      if (!donation || donation.status !== "Available") return;

      donation.status = "Accepted";
      donation.volunteer = role;
      notify("Pickup accepted for " + donation.name);
      saveData();
      toast("Pickup accepted! 🚴");
    }

    function updateStatus(id, status) {
      const donation = donations.find(d => d.id === id);
      if (!donation) return;

      donation.status = status;
      notify(donation.name + " status updated to " + status);
      saveData();
      toast("Status updated to " + status);
    }

    function openMap(id) {
      const donation = donations.find(d => d.id === id);
      if (!donation) return;

      const url = "https://www.google.com/maps/search/?api=1&query=" +
        encodeURIComponent(donation.location);
      window.open(url, "_blank", "noopener,noreferrer");
    }

    // Role cards
    document.querySelectorAll(".role-card").forEach(card => {
      const pick = () => {
        document.getElementById("role").value = card.dataset.role;
        render();
        toast("Role set to " + card.dataset.role);
      };
      card.addEventListener("click", pick);
      card.addEventListener("keydown", e => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(); }
      });
    });

    document.getElementById("markRead").addEventListener("click", () => {
      readCount = notifications.length;
      saveData();
    });

    showPage("dashboard");
  </script>
</body>
</html>
